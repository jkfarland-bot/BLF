related_formalizations: []

status:
  scope: >-
    Formalized: the parallelogram inequality for floors of linear forms, threshold implies BLF and
    closure of BLF under XOR with GF(2)-affine functions (every n), and the exact counts
    |BLF(n)| for n = 1, 2, 3, 4, the equality BLF(3) = threshold XOR affine and the description of
    BLF(4) as threshold XOR affine together with the translates of bit 1 of x1 + x2 + x3 + x4.
    It also proves that this function is not threshold XOR affine. Not formalized, and labeled in the preprint as computer-certified
    or as paper proofs: the characterization by floor(u) mod 2 for real affine u, the identity
    |BLF(n)| = 2^n (R_n + 1) with the toric chamber count R_n, the counts for n = 5 and 6, the
    asymptotics, the anti-Hadamard second-order term, and the cellular-automaton results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude agent seats (Claude.ai with code execution and the Claude Agent SDK), run under the author's team process"
      tool_setup: >-
        AI-generated: every Lean file was written by Claude Opus 5.5 from the paper's statements
        and proofs, compiled with lake against the pinned Mathlib, and checked with the toolchain's
        lake comparator (Lean kernel, nanoda and con-ron), a module-wide axiom collector (only
        propext, Classical.choice and Quot.sound), non-vacuity instances and planted errors that
        must fail. The data files BLF/Data1.lean to BLF/Data4.lean are generated by
        scripts/gen_small.py and the split check BLF/Check4.lean by scripts/gen_split.py; every
        fact in them is rechecked by the kernel.
      cost:
        wall_time: "one working day, 21 November 2026, building on agent runs from 5 to 11 November"
        spend_usd: "not tracked"
        hardware: "API-only plus a cloud workspace"
      prompting_notes: >-
        The forbidden constructs (sorry, native_decide, new axioms) and the checks were fixed in
        advance; the kernel computations use decide +kernel only.
  spend_usd: "not tracked"
  notes: >-
    The results, proofs, paper and Lean code were produced by Claude agent seats under the
    author's direction; several results came from ChatGPT (OpenAI) answers checked by Claude
    seats, as the preprint records. The author chose the problems, ran the process and takes
    responsibility for errors.

fidelity:
  divergences: >-
    Boolean functions are maps (Fin n -> Bool) -> Bool and counts are Nat.card of the subtype.
    Bit j of an integer N is (N / 2^j) % 2 with Int division (floor for a positive divisor), which
    is two's complement for negative N; the coefficients and constant are arbitrary integers and
    j is unbounded. The GF(2)-affine functions are written as (c + sum b_i x_i) mod 2 over the
    integers (affB); threshold functions are [w0 + w.x > 0] with integer weights (every threshold
    function has an integer realization, so nothing is lost).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus agent seats (Anthropic) that did not write the code they checked: two independent Lean verifiers (review/lean1, review/lean2) and cold readers of the paper proofs (coldread/)"
  notes: >-
    Each verifier made a fresh copy and rebuilt it, checked source hygiene and the byte identity
    of the definitions, ran an axiom collector over every theorem in the BLF namespace (only
    propext, Classical.choice and Quot.sound), audited each statement in Challenge.lean, proved
    non-vacuity instances, recounted with its own code, planted errors that the build rejected,
    and ran the toolchain's lake comparator (Lean kernel, nanoda and con-ron accept). The second
    verifier also wrote the proof that bit 1 of x1 + x2 + x3 + x4 is not threshold XOR affine. No
    human referee has reviewed the preprint or the formalization; the author is responsible for
    both.

alignment:
  namespace: "BLF"
  statements:
    - source: "Lemma 2.4"
      lean: "BLF.floor_parallelogram"
      module: "Challenge"
      status: "proved"
      note: "Every n, j, K, a and cube vertices with x + y = z + w."
    - source: "Proposition 2.3"
      lean: "BLF.threshold_isBLF"
      module: "Challenge"
      status: "proved"
      note: "Every n and integer weights."
    - source: "Proposition 2.2 (XOR with affine functions)"
      lean: "BLF.isBLF_xor_affB"
      module: "Challenge"
      status: "proved"
      note: "Every n."
    - source: "Theorem 5.1(1)"
      lean: "BLF.blf_count_four"
      module: "Challenge"
      status: "proved"
      note: "Also BLF.blf_count_one, blf_count_two, blf_count_three (4, 16, 208)."
    - source: "Theorem 5.1(2)"
      lean: "BLF.blf_three_iff_threshold_xor_affine"
      module: "Challenge"
      status: "proved"
      note: "IsBLF f iff IsTXA f for every f of three variables."
    - source: "Theorem 5.1(3), first part"
      lean: "BLF.blf_four_iff"
      module: "Challenge"
      status: "proved"
      note: "IsBLF f iff IsTXA f or f is bit 1 of x1 + x2 + x3 + x4 XOR an affine function."
    - source: "Theorem 5.1(3), second part"
      lean: "BLF.bitOneSum_isBLF_not_txa"
      module: "Challenge"
      status: "proved"
      note: "Bit 1 of x1 + x2 + x3 + x4 is BLF and not threshold XOR affine."

