related_formalizations: []

status:
  scope: >-
    Formalized: the characterization by floor(u) mod 2 for real affine u, the parallelogram inequality
    for floors of linear forms, threshold implies BLF and closure of BLF under XOR with GF(2)-affine
    functions (every n), the selector lemma for gated thresholds (every n and j) with the example that
    needs bit 4, that two and three steps of Rule 110 are not BLF, and the exact counts
    |BLF(n)| for n = 1, 2, 3, 4, the equality BLF(3) = threshold XOR affine and the description of
    BLF(4) as threshold XOR affine together with the translates of bit 1 of x1 + x2 + x3 + x4.
    It also proves that this function is not threshold XOR affine. Not formalized, and labeled in the preprint as computer-certified
    or as paper proofs: the identity
    |BLF(n)| = 2^n (R_n + 1) with the toric chamber count R_n, the counts for n = 5 and 6, the
    asymptotics, the anti-Hadamard matrices and the bit-position asymptotics, and the operation counts
    for cellular automata (one-floor lemma, two-operation bound, three-operation construction).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude agent seats (Claude.ai with code execution and the Claude Agent SDK), run under the author's team process"
      tool_setup: >-
        AI-generated: every Lean file was written by Claude Opus 5.5 from the paper's statements
        and proofs, compiled with lake against the pinned Mathlib, and checked with the toolchain's
        lake comparator (Lean kernel, nanoda and con-ron), a module-wide axiom collector (only
        propext, Classical.choice and Quot.sound), non-vacuity instances and planted errors that
        must fail. The data files BLF/Data1.lean to BLF/Data4.lean are generated by
        scripts/gen_small.py and the split check BLF/Check4.lean by scripts/gen_split.py; every
        fact in them is rechecked by the kernel.
      cost:
        wall_time: "one working day, 21 November 2026, building on agent runs from 5 to 11 November"
        spend_usd: "not tracked"
        hardware: "API-only plus a cloud workspace"
      prompting_notes: >-
        The forbidden constructs (sorry, native_decide, new axioms) and the checks were fixed in
        advance; the kernel computations use decide +kernel only.
  spend_usd: "not tracked"
  notes: >-
    The results, proofs, paper and Lean code were produced by Claude agent seats under the
    author's direction; several results came from ChatGPT (OpenAI) answers checked by Claude
    seats, as the preprint records. The author chose the problems, ran the process and takes
    responsibility for errors.

fidelity:
  divergences: >-
    Boolean functions are maps (Fin n -> Bool) -> Bool and counts are Nat.card of the subtype.
    Bit j of an integer N is (N / 2^j) % 2 with Int division (floor for a positive divisor), which
    is two's complement for negative N; the coefficients and constant are arbitrary integers and
    j is unbounded. The GF(2)-affine functions are written as (c + sum b_i x_i) mod 2 over the
    integers (affB); threshold functions are [w0 + w.x > 0] with integer weights (every threshold
    function has an integer realization, so nothing is lost).

review:
  status: "agent-reviewed"
  reviewers:
    - "Two Claude Opus verifier agents (Anthropic) that did not write the code, each auditing an earlier commit: review/lean1 (commit cb688a7, seven statements) and review/lean2 (commit 3e2e68f, nine statements). No independent audit covers the tenth statement. Cold readers of the paper proofs: coldread/."
  notes: >-
    Independent audits of earlier commits. review/lean1/VERIFY_LEAN.md checked commit cb688a7,
    whose Challenge.lean stated seven theorems: floor_parallelogram, threshold_isBLF,
    isBLF_xor_affB and blf_count_one to blf_count_four. On a fresh copy it rebuilt the project,
    checked source hygiene and the byte identity of the definitions, collected the axioms of every
    theorem, audited those seven statements, proved non-vacuity instances, recounted n <= 4 with
    its own code and planted errors that the build rejected. Its comparator run was partial: the
    Lean kernel and con-ron accepted, and nanoda ran out of memory on blf_count_four in a 6 GiB
    sandbox. review/lean2/VERIFY_LEAN2.md checked commit 3e2e68f, whose Challenge.lean stated nine
    theorems: the seven above, textually unchanged (it checked the diff from cb688a7), plus
    blf_three_iff_threshold_xor_affine and blf_four_iff. It made the same checks on those nine,
    and lake comparator accepted all nine with the Lean kernel, nanoda and con-ron. The tenth
    statement, bitOneSum_isBLF_not_txa, with its proof in BLF/Strict.lean, was added at commit
    9e48384, after both reports. That proof was written by the second verifier agent after its
    report, from its non-vacuity lemma (review/lean2/NonVacuity2.lean.txt); no independent report
    audits the tenth statement. From 3e2e68f to 9e48384 the Lean sources changed only by that
    statement, its proof, its comparator entry and the import in BLF.lean; they have not changed
    since 9e48384.
    Mechanical verification of the ten-theorem submission, distinct from the audits above: on
    every push, GitHub Actions builds the project, checks the Lean source requirements and the
    byte identity of the definitions block, validates this file, and runs the toolchain's lake
    comparator, which accepts all ten theorems with the Lean kernel, nanoda and con-ron and with
    only propext, Quot.sound and Classical.choice permitted (for example the run on commit
    3d90ee7). No human referee has reviewed the preprint or the formalization; the author is
    responsible for both.

alignment:
  namespace: "BLF"
  statements:
    - source: "Proposition 2.1"
      lean: "BLF.isBLF_iff_floor"
      module: "Challenge"
      status: "proved"
      note: "Every n; t and r real, Int.floor, parity."
    - source: "Lemma 2.4"
      lean: "BLF.floor_parallelogram"
      module: "Challenge"
      status: "proved"
      note: "Every n, j, K, a and cube vertices with x + y = z + w."
    - source: "Proposition 2.3"
      lean: "BLF.threshold_isBLF"
      module: "Challenge"
      status: "proved"
      note: "Every n and integer weights."
    - source: "Proposition 2.2 (XOR with affine functions)"
      lean: "BLF.isBLF_xor_affB"
      module: "Challenge"
      status: "proved"
      note: "Every n."
    - source: "Theorem 5.1(1)"
      lean: "BLF.blf_count_four"
      module: "Challenge"
      status: "proved"
      note: "Also BLF.blf_count_one, blf_count_two, blf_count_three (4, 16, 208)."
    - source: "Theorem 5.1(2)"
      lean: "BLF.blf_three_iff_threshold_xor_affine"
      module: "Challenge"
      status: "proved"
      note: "IsBLF f iff IsTXA f for every f of three variables."
    - source: "Theorem 5.1(3), first part"
      lean: "BLF.blf_four_iff"
      module: "Challenge"
      status: "proved"
      note: "IsBLF f iff IsTXA f or f is bit 1 of x1 + x2 + x3 + x4 XOR an affine function."
    - source: "Theorem 5.1(3), second part"
      lean: "BLF.bitOneSum_isBLF_not_txa"
      module: "Challenge"
      status: "proved"
      note: "Bit 1 of x1 + x2 + x3 + x4 is BLF and not threshold XOR affine."

    - source: "Lemma 8.2"
      lean: "BLF.selector_iff"
      module: "Challenge"
      status: "proved"
      note: "Every n and j, in the equivalent form: realizable at bit j iff some integer representation has sum |w_i| < 2^j."
    - source: "Lemma 8.2 (status line: the threshold 0xfc80)"
      lean: "BLF.gated_threshold_bit_four"
      module: "Challenge"
      status: "proved"
      note: "z AND [x1 + 2x2 + 2x3 + 3x4 >= 5] is bit 4 and not bit 3."
    - source: "Proposition 8.1 (status line: j*(5) >= 4)"
      lean: "BLF.blf_five_needs_bit_four"
      module: "Challenge"
      status: "proved"
      note: "No bit position j <= 3 serves every BLF function of five variables."
    - source: "Corollary 9.3 (two steps)"
      lean: "BLF.rule110Two_not_isBLF"
      module: "Challenge"
      status: "proved"
      note: "Two steps of Rule 110 on a window of five cells are not BLF."
    - source: "Corollary 9.3 (three steps)"
      lean: "BLF.rule110Three_not_isBLF"
      module: "Challenge"
      status: "proved"
      note: "Three steps of Rule 110 on a window of seven cells are not BLF."

