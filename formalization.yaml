version: "v0.4"

project:
  name: "BLF: Boolean functions that are one bit of a linear form"
  description: >-
    A Boolean function f of n variables is BLF if f(x) is bit j of K + a_1 x_1 + ... + a_n x_n for
    some integers K, a_i and some bit position j. The development proves, for every n, that the
    floors of (K + a.x) / 2^j satisfy every parallelogram inequality on the cube, that every
    threshold function is BLF, and that BLF is closed under XOR with GF(2)-affine functions; and
    it proves the exact counts |BLF(n)| = 4, 16, 208 and 10368 for n = 1, 2, 3 and 4 by a verified
    pruned search checked by the kernel, that BLF(3) is exactly the threshold functions XOR
    GF(2)-affine functions, and that BLF(4) adds exactly the affine translates of bit 1 of
    x1 + x2 + x3 + x4, which is not itself threshold XOR affine.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.CO", "cs.DM"]
  msc2020: ["06E30", "52C35", "05A15", "94C11", "68V20"]

